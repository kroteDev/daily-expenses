# Nginx reverse proxy config for Daily Expenses
# Place this file in /etc/nginx/sites-available/daily-expenses
# and symlink it from /etc/nginx/sites-enabled/
#
# Assumes:
# - SSL certificates are already configured at the paths below
# - The Docker Compose services expose ports 5000 (api) and 5001 (web)

upstream daily_expenses_web {
    server 127.0.0.1:5001;
}

upstream daily_expenses_api {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name expenses.krotedev.com.br api.expenses.krotedev.com.br;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name expenses.krotedev.com.br;

    # Update these paths to match your actual certificate locations
    ssl_certificate /etc/letsencrypt/live/expenses.krotedev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expenses.krotedev.com.br/privkey.pem;

    location / {
        proxy_pass http://daily_expenses_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

server {
    listen 443 ssl http2;
    server_name api.expenses.krotedev.com.br;

    # Update these paths to match your actual certificate locations
    ssl_certificate /etc/letsencrypt/live/api.expenses.krotedev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.expenses.krotedev.com.br/privkey.pem;

    location / {
        proxy_pass http://daily_expenses_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
